<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 48 48">
  <!-- Full-bleed, no baked-in corner rounding — iOS/Android apply their own
       squircle/circle mask. Same "Open Fourth" geometry as GolfMeIcon.tsx
       and favicon.svg (uniform viewBox scale keeps every circle perfectly
       circular, never stretched), just pulled slightly closer to center
       than the UI-context versions so all four spots stay inside the
       maskable-icon safe zone (80%-diameter centered circle) even under an
       aggressive circular/squircle crop. -->
  <rect width="48" height="48" fill="#143621"/>
  <circle cx="15" cy="15" r="5.5" fill="#f8faf8"/>
  <circle cx="33" cy="15" r="5.5" fill="#f8faf8"/>
  <circle cx="15" cy="33" r="5.5" fill="#f8faf8"/>
  <circle cx="33" cy="33" r="5.5" fill="#5aa171"/>
  <circle cx="33" cy="33" r="3.6" fill="#143621"/>
  <circle cx="33" cy="33" r="1.6" fill="#5aa171"/>
</svg>
