<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Filenames carry a -v2 suffix so browsers that cache favicons outside
         normal HTTP cache rules are forced to fetch the current mark instead
         of continuing to show whatever was cached under the old URL. Bump
         this suffix again if the mark ever changes and the tab icon still
         looks stale after a deploy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#166534" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Golf Me" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Golf Me — Find your next foursome." />
    <title>Golf Me</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
