<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Filenames carry a -v2 suffix so browsers that cache favicons outside
         normal HTTP cache rules are forced to fetch the current mark instead
         of continuing to show whatever was cached under the old URL. Bump
         this suffix again if the mark ever changes and the tab icon still
         looks stale after a deploy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v3.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png" />
    <!-- iOS has no auto-generated PWA launch splash from the manifest the
         way Android/Chrome do — without these, the native launch transition
         (tap the home-screen icon -> WebView's first paint) shows nothing
         branded at all, so whatever page loads first (the marketing/Welcome
         page for a logged-out visit) is the first thing seen. These fill
         that specific gap with the logo on the app's own background,
         matching GolfMeLoader's fullScreen look so the transition into the
         real in-app loader is seamless. Media queries match Apple's own
         documented device-width/height (logical pixels) + pixel-ratio
         pattern; three sizes cover the great majority of current iPhones
         (SE-class, standard, Pro Max) — not exhaustive of every model. -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-se.png"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-standard.png"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-promax.png"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#166534" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Golf Me" />
    <!-- interactive-widget=resizes-content: tells a supporting engine (WKWebView
         on iOS 17.4+, recent Chrome) to genuinely resize the layout viewport
         for the on-screen keyboard rather than just overlaying/panning over
         it -- the same effect as Capacitor's own Keyboard resize:"body"
         config (see capacitor.config.ts) but at the web-platform level, so
         the plain browser/PWA path (not just the native app) benefits too. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Golf Me — Find your next foursome." />
    <title>Golf Me</title>
    <!-- Paint the app's cream from the very first frame, before the CSS
         bundle arrives, so a launch never flashes white (matches the native
         web view's backgroundColor in capacitor.config.ts). -->
    <style>html { background: #faf9f6; }
      /* EntryOverlay launch: the iOS launch image's green until the overlay
         itself is up, so there's no cream frame between the two. */
      html.gm-entry-boot, html.gm-entry-boot body { background: #143822 !important; }</style>
    <!-- Decides, once per page load and before the bundle runs, whether the
         branded entry plays (EntryOverlay reads the class this sets):
         installed app only (Capacitor native or home-screen PWA), the
         per-device test switch on (About -> tap the version 7 times), and
         not already shown in this web view (sessionStorage survives in-app
         reloads and resumes, not a cold launch). `?entry` forces a preview
         in a normal browser tab, on a local dev server only. -->
    <script>
      (function () {
        try {
          var local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
          var forced = local && new URLSearchParams(location.search).has("entry");
          var nav = window.navigator;
          var standalone =
            !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
            nav.standalone === true ||
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          if (!forced && !(standalone && localStorage.getItem("golfme:entryTest") === "1")) return;
          if (!forced && sessionStorage.getItem("golfme:entryShown")) return;
          sessionStorage.setItem("golfme:entryShown", "1");
          document.documentElement.classList.add("gm-entry-boot");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
