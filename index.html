<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Filenames carry a -v2 suffix so browsers that cache favicons outside
         normal HTTP cache rules are forced to fetch the current mark instead
         of continuing to show whatever was cached under the old URL. Bump
         this suffix again if the mark ever changes and the tab icon still
         looks stale after a deploy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v3.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png" />
    <!-- iOS has no auto-generated PWA launch splash from the manifest the
         way Android/Chrome do — without these, the native launch transition
         (tap the home-screen icon -> WebView's first paint) shows nothing
         branded at all, so whatever page loads first (the marketing/Welcome
         page for a logged-out visit) is the first thing seen. These fill
         that specific gap with the logo on the app's own background,
         matching GolfMeLoader's fullScreen look so the transition into the
         real in-app loader is seamless. Media queries match Apple's own
         documented device-width/height (logical pixels) + pixel-ratio
         pattern; three sizes cover the great majority of current iPhones
         (SE-class, standard, Pro Max) — not exhaustive of every model. -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-se.png"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-standard.png"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-promax.png"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#166534" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GolfMe" />
    <!-- interactive-widget=resizes-content: tells a supporting engine (WKWebView
         on iOS 17.4+, recent Chrome) to genuinely resize the layout viewport
         for the on-screen keyboard rather than just overlaying/panning over
         it -- the same effect as Capacitor's own Keyboard resize:"body"
         config (see capacitor.config.ts) but at the web-platform level, so
         the plain browser/PWA path (not just the native app) benefits too. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- SEO / sharing. One static page serves both the public landing page
         and the app shell; the landing page is what crawlers and link
         previews see, so these describe GolfMe the product. The app does not
         manage document.title itself, so the title below is what shows in
         the tab everywhere — keep it the brand name first. -->
    <title>GolfMe — Find golf partners, join rounds &amp; get AI swing feedback</title>
    <meta
      name="description"
      content="GolfMe helps golfers find playing partners, fill foursomes, host and join rounds near you, chat, and improve with AI Caddie swing analysis. Free on the App Store. Built in NYC."
    />
    <link rel="canonical" href="https://golfme.app/" />
    <!-- Google Search Console ownership (URL-prefix property, HTML-tag method) -->
    <meta name="google-site-verification" content="D49gXXSGOEPu1FjKvgqw5WiMjwyMEw15qSSwkgHaOVM" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Shows the native App Store banner at the top of Safari on iOS -->
    <meta name="apple-itunes-app" content="app-id=6806917441" />
    <script>
      // On a shared round link, the banner's "Open" hands the same round to
      // the app (appUrlOpen -> routeForAppUrl) instead of just launching it.
      // Set before the banner is drawn; same paths as the AASA allowlist.
      (function () {
        var p = location.pathname.replace(/\/+$/, "");
        if (/^\/golf-calls\/[0-9a-f-]{36}$/i.test(p)) {
          var m = document.querySelector('meta[name="apple-itunes-app"]');
          if (m) m.setAttribute("content", "app-id=6806917441, app-argument=https://golfme.app" + p);
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GolfMe" />
    <meta property="og:url" content="https://golfme.app/" />
    <meta property="og:title" content="GolfMe — Find your foursome. Get better with AI Caddie." />
    <meta
      property="og:description"
      content="Find golfers near you, join open rounds, and get AI swing analysis. Free on the App Store."
    />
    <meta property="og:image" content="https://golfme.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GolfMe — Find your foursome. Get better with AI Caddie." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GolfMe — Find your foursome. Get better with AI Caddie." />
    <meta
      name="twitter:description"
      content="Find golfers near you, join open rounds, and get AI swing analysis. Free on the App Store."
    />
    <meta name="twitter:image" content="https://golfme.app/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://golfme.app/#organization",
            "name": "GolfMe",
            "url": "https://golfme.app/",
            "logo": "https://golfme.app/icons/icon-512-v3.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://golfme.app/#website",
            "url": "https://golfme.app/",
            "name": "GolfMe",
            "publisher": { "@id": "https://golfme.app/#organization" }
          },
          {
            "@type": "MobileApplication",
            "@id": "https://golfme.app/#app",
            "name": "GolfMe",
            "url": "https://golfme.app/",
            "installUrl": "https://apps.apple.com/us/app/golfme/id6806917441",
            "operatingSystem": "iOS",
            "applicationCategory": "SportsApplication",
            "description": "Find golf partners, fill foursomes, host and join rounds near you, chat with golfers, and improve with AI Caddie swing analysis.",
            "image": "https://golfme.app/og.png",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@id": "https://golfme.app/#organization" }
          }
        ]
      }
    </script>
    <!-- Paint the app's cream from the very first frame, before the CSS
         bundle arrives, so a launch never flashes white (matches the native
         web view's backgroundColor in capacitor.config.ts). -->
    <style>html { background: #faf9f6; }
      /* EntryOverlay launch: the iOS launch image's green until the overlay
         itself is up, so there's no cream frame between the two. */
      html.gm-entry-boot, html.gm-entry-boot body { background: #143822 !important; }
      /* Prerendered landing page (scripts/prerender-landing.mjs injects
         <div id="prerender"> into the built index.html). The guard script
         below picks one of two modes before anything paints:
         gm-app: a signed-in/native/installed visit -- the static copy is
                 never shown; the app boots exactly as it always has.
         gm-static-landing: a signed-out visit to / or /welcome -- the
                 static landing page is what the visitor sees from the
                 first frame, and #root stays invisible (never the loader
                 flashing over it) until Welcome.tsx has mounted the real
                 page and removes both the static copy and this class. */
      html.gm-app #prerender { display: none !important; }
      html.gm-static-landing #root { visibility: hidden; position: absolute; inset: 0; }</style>
    <script>
      (function () {
        try {
          var cap = window.Capacitor;
          var native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
          var standalone =
            window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          var signedIn = localStorage.getItem("golfme:isDemo") === "1";
          for (var i = 0; !signedIn && i < localStorage.length; i++) {
            var k = localStorage.key(i) || "";
            if (k.indexOf("sb-") === 0 && k.indexOf("-auth-token") > 0) signedIn = true;
          }
          // Coming back from Google / a sign-in link: the tokens (or an
          // error) are still in the URL and not yet in localStorage. That's a
          // sign-in, not a landing visit; treating it as one hid the app for
          // up to 8 s after Google sign-in (2026-10-26).
          if (/(^|[#&])(access_token|refresh_token|error_description|error_code)=/.test(location.hash) || /[?&]code=/.test(location.search)) {
            signedIn = true;
          }
          var landingPath = location.pathname === "/" || location.pathname === "/welcome" || location.pathname === "/welcome/";
          var cls = document.documentElement.classList;
          if (native || standalone || signedIn || !landingPath) {
            cls.add("gm-app");
          } else {
            cls.add("gm-static-landing");
            // Safety net: if the app never mounts Welcome (script error,
            // ErrorBoundary), don't leave #root hidden forever.
            setTimeout(function () {
              cls.remove("gm-static-landing");
            }, 8000);
          }
        } catch (e) {
          document.documentElement.classList.add("gm-app");
        }
      })();
    </script>
    <!-- Decides, once per page load and before the bundle runs, whether the
         branded entry plays (EntryOverlay reads the class this sets):
         a native build with the plain-green launch screen (it contains the
         SplashScreen plugin), or an installed app (native or home-screen
         PWA) with the per-device test switch on (About -> tap the version 7
         times), and
         not already shown in this web view (sessionStorage survives in-app
         reloads and resumes, not a cold launch). `?entry` forces a preview
         in a normal browser tab, on a local dev server only. -->
    <script>
      (function () {
        try {
          var local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
          var forced = local && new URLSearchParams(location.search).has("entry");
          var nav = window.navigator;
          var standalone =
            !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
            nav.standalone === true ||
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          var cap = window.Capacitor;
          var newLaunchScreen = !!(cap && cap.Plugins && Object.prototype.hasOwnProperty.call(cap.Plugins, "SplashScreen"));
          if (!forced && !(newLaunchScreen || (standalone && localStorage.getItem("golfme:entryTest") === "1"))) return;
          if (!forced && sessionStorage.getItem("golfme:entryShown")) return;
          sessionStorage.setItem("golfme:entryShown", "1");
          document.documentElement.classList.add("gm-entry-boot");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
